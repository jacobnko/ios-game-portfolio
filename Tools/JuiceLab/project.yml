name: JuiceLab
options:
  bundleIdPrefix: com.jacobkostudio
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  CoreKit:
    path: ../../Packages/CoreKit

targets:
  JuiceLab:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: CoreKit
        product: CoreKitJuice
      - package: CoreKit
        product: CoreKitData
      - package: CoreKit
        product: CoreKitServices
      - package: CoreKit
        product: CoreKitAdsGoogle
      - package: CoreKit
        product: CoreKitUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobkostudio.juicelab
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Google's public test application id. Never replace this in the harness.
        INFOPLIST_KEY_GADApplicationIdentifier: "ca-app-pub-3940256099942544~1458002511"
        INFOPLIST_KEY_NSUserTrackingUsageDescription: "Used to show ads that are more relevant to you."


schemes:
  JuiceLab:
    build:
      targets:
        JuiceLab: all
    run:
      config: Debug
      # Lets purchase flows run without App Store Connect. Never ship a build
      # that still points at this file.
      storeKitConfiguration: JuiceLab.storekit
    test:
      config: Debug
