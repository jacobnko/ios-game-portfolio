name: JuiceLab
options:
  bundleIdPrefix: com.jacobkostudio
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  CoreKit:
    path: ../../Packages/CoreKit

targets:
  JuiceLab:
    type: application
    platform: iOS
    sources: [Sources]
    # A real Info.plist, not GENERATE_INFOPLIST_FILE. Xcode only maps
    # INFOPLIST_KEY_* for a fixed list of known keys; GADApplicationIdentifier is
    # not on it, so setting it that way is silently dropped and the ads SDK then
    # throws GADInvalidInitializationException on launch.
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Google's public test application id. Never replace this in the harness.
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        NSUserTrackingUsageDescription: Used to show ads that are more relevant to you.
    dependencies:
      - package: CoreKit
        product: CoreKitJuice
      - package: CoreKit
        product: CoreKitData
      - package: CoreKit
        product: CoreKitServices
      - package: CoreKit
        product: CoreKitAdsGoogle
      - package: CoreKit
        product: CoreKitUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobkostudio.juicelab
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic


schemes:
  JuiceLab:
    build:
      targets:
        JuiceLab: all
    run:
      config: Debug
      # Lets purchase flows run without App Store Connect. Never ship a build
      # that still points at this file.
      storeKitConfiguration: JuiceLab.storekit
    test:
      config: Debug
